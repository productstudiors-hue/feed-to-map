<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18212B">
<title>מהפיד למפה</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F4F2; --surface:#FFFFFF; --ink:#18212B; --muted:#5D6B72; --line:#D3DCD8;
  --pin:#C92F6F; --pin-ink:#FFFFFF; --route:#0F7F74; --soft:#E4ECE9; --warn:#9A6200; --warn-bg:#FBF0DA;
  --f-display:"Karantina","Rubik",system-ui,sans-serif; --f-body:"Rubik","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#111619; --surface:#1A2126; --ink:#E6ECEA; --muted:#97A6AC; --line:#2D383E;
  --pin:#EC5F98; --pin-ink:#1A0A11; --route:#3DBFAE; --soft:#222C31; --warn:#E9B65A; --warn-bg:#33281A; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-size:40px;line-height:1}
.brand h1 span{color:var(--pin)}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:13px;direction:ltr;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
button,.btn{font:inherit;font-weight:500;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:disabled{opacity:.55;cursor:default}
.small{padding:6px 10px;font-size:13px;border-radius:10px}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.status{margin:0;font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--pin)}
.bar{height:3px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--pin);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(120%)}to{transform:translateX(-340%)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px}
.head h2{font-family:var(--f-display);font-size:32px;line-height:1.05}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.map{position:relative;aspect-ratio:4/3.4;max-height:62vh;width:100%;background:var(--soft)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 6px}
.tabs button[aria-selected=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.count{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.place{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.place.sel{border-color:var(--pin);box-shadow:0 0 0 1px var(--pin)}
.num{width:26px;height:26px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.body h3{font-size:16px;font-weight:600}
.local{font-size:12px;color:var(--muted)}
.body p{margin:0;font-size:14px}
.sub{font-size:13px;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:13px}
.score small{font-family:var(--f-body);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.day h3{font-family:var(--f-display);font-size:24px;line-height:1}
.stops{list-style:none;margin:0;padding:0 12px 0 0;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stops li{display:flex;gap:10px;align-items:baseline}
.stops .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:50px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
.setup{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px;font-size:13px}
.setup b{color:var(--ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(17,22,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow-y:auto;box-sizing:border-box}
.sheet h3{font-family:var(--f-display);font-size:28px;line-height:1}
.folders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fbtn{width:100%;justify-content:space-between;text-align:right;min-height:52px;white-space:normal}
.card-btn{padding:14px 16px;border-radius:14px}
.newf{display:flex;flex-direction:column;gap:6px}
.newf label{font-size:12px;font-weight:600;color:var(--muted)}
.daysbar{justify-content:space-between;margin-bottom:10px}
.sec{font-family:var(--f-display);font-size:24px;line-height:1;margin:14px 0 8px}
.primary-link{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#panel .day+.day{margin-top:10px}
.reset{margin-top:28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.danger{background:var(--pin);color:var(--pin-ink);border-color:var(--pin)}
</style>
</head>
<body>
<main class="app">
  <header class="brand"><h1>מהפיד <span>למפה</span></h1><span class="count" id="ver">v0.4</span></header>

  <form class="scan" id="form">
    <input id="url" type="url" inputmode="url" placeholder="הדבק קישור מטיקטוק או אינסטגרם" aria-label="קישור לסרטון" required>
    <button class="primary" id="go" type="submit">סרוק</button>
  </form>
  <div class="row"><button class="small" id="paste" type="button">הדבק מהלוח</button><span class="sub">או: שתף מטיקטוק ← מהפיד למפה (באנדרואיד, אחרי "הוסף למסך הבית")</span></div>
  <div class="bar" id="bar" hidden><i></i></div>
  <p class="status" id="status" role="status"></p>
  <div id="setup"></div>
  <form class="scan" id="pinForm" hidden>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="קוד גישה אישי" aria-label="קוד גישה אישי" style="direction:rtl;text-align:right;font-family:var(--f-body)">
    <button class="primary" type="submit">שמור</button>
  </form>

  <section class="card" id="card" hidden>
    <div class="head">
      <div class="meta" id="meta"></div>
      <h2 id="title"></h2>
    </div>
    <div class="map"><iframe id="gmap" title="מפת גוגל" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    <div class="mapbar"><span id="mapLabel">כל המקומות</span>
      <span class="row"><button class="small" id="showAll" type="button" hidden>הצג הכל</button><a class="btn small" id="openG" target="_blank" rel="noopener">פתח באפליקציית מפות</a></span></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs" hidden></nav>
  <section id="panel"></section>
  <footer class="reset" id="resetBox">
    <button class="small" id="resetAsk" type="button">איפוס האפליקציה</button>
    <div id="resetConfirm" class="setup" hidden>
      <p style="margin:0 0 8px"><b>למחוק מהמכשיר הזה את כל התיקיות, הסרטונים והמקומות?</b> אי אפשר לבטל את זה.</p>
      <div class="row"><button class="small danger" id="resetYes" type="button">מחק הכל</button><button class="small" id="resetNo" type="button">ביטול</button></div>
    </div>
  </footer>
</main>
<div id="sheet" class="sheet-bg" hidden></div>

<script>
/* ---- config: the server that reads the video ---- */
const API = "https://klzbaonibjyktzxhkjcg.supabase.co/functions/v1/scan";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsemJhb25pYmp5a3R6eGhramNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MzEzMTcsImV4cCI6MjEwOTAwNzMxN30.Y-lq_5AhnQ5oHWcjms502FJT2rbTNx8qhS-SS-4hzXE";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };


/* ---- Google map (embed, no key needed) ---- */
// Google resolves place names to the real business; raw coordinates show street addresses instead.
const loc = (p, city) => p.query || [p.name, p.neighborhood && /[a-z]/i.test(p.neighborhood) ? p.neighborhood : "", p.city || city].filter(Boolean).join(", ") || `${p.lat},${p.lng}`;
const label = (p, city) => [p.name, city].filter(Boolean).join(", ");
function embedAll(places, city, mode){
  const pts = places.slice(0, 10);
  if (!pts.length) return "about:blank";
  // One unknown stop breaks a Google route, so without smart extraction show the city and let the user tap places.
  if (mode === "simple" && city) return `https://maps.google.com/maps?output=embed&hl=he&z=13&q=${encodeURIComponent(city)}`;
  if (pts.length === 1) return embedOne(pts[0], city);
  const [first, ...rest] = pts;
  return `https://maps.google.com/maps?output=embed&hl=he&saddr=${encodeURIComponent(loc(first, city))}&daddr=${rest.map(p => encodeURIComponent(loc(p, city))).join("+to:")}`;
}
function embedOne(p, city){
  return `https://maps.google.com/maps?output=embed&hl=he&z=16&q=${encodeURIComponent(label(p, city))}${isFinite(p.lat)&&p.lat?`&ll=${p.lat},${p.lng}`:""}`;
}
const openOne = (p, city) => p.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(label(p, city))}`;
function openRoute(places, city){
  const q = places.slice(0, 10).map(p => encodeURIComponent(loc(p, city)));
  if (q.length < 2) return places[0] ? openOne(places[0], city) : "#";
  let u = `https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${q[0]}&destination=${q[q.length-1]}`;
  if (q.length > 2) u += `&waypoints=${q.slice(1,-1).join("%7C")}`;
  return u;
}

const cleanTitle = t => (String(t || "").split(/📍|\d\uFE0F?\u20E3/u)[0]
  .replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, "").replace(/\s+/g, " ").trim().slice(0, 70)) || "תוצאות";

/* ---- scanning ---- */
function setStatus(t, err){ $("#status").textContent = t; $("#status").classList.toggle("err", !!err); }
const extractUrl = s => (String(s||"").match(/https?:\/\/[^\s"'<>]+/) || [""])[0];

async function scan(raw){
  const url = extractUrl(raw);
  if (!url) { setStatus("לא מצאתי קישור. הדבק קישור שמתחיל ב־https://", true); return; }
  $("#url").value = url;
  $("#go").disabled = true; $("#bar").hidden = false; $("#setup").innerHTML = "";
  setStatus("קורא את הסרטון ומאתר את המקומות… (10–40 שניות)");
  try {
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${ANON}`, apikey: ANON }, body: JSON.stringify({ url, pin: store.get("ftm_pin", "") }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { $("#pinForm").hidden = false; $("#pin").focus(); setStatus("הזן את קוד הגישה האישי שלך כדי לסרוק.", true); state.pendingUrl = url; return; }
    if (!r.ok) {
      setStatus(j.message || "השרת לא הצליח לעבד את הסרטון.", true);
      if (j.needs === "APIFY_TOKEN") $("#setup").innerHTML = `<div class="setup"><b>חסר שלב הגדרה:</b> טיקטוק מסתיר את הכיתוב משרתים בענן. צריך להוסיף מפתח Apify לשרת, ואז הקישור לבד יספיק.</div>`;
      return;
    }
    if (!j.places?.length) { setStatus("קראתי את הסרטון אבל לא מצאתי בו שמות של מקומות.", true); return; }
    state.res = j; state.sel = null; state.tab = "list"; state.folder = null; delete state.days.v;
    store.set("ftm_last", j);
    setStatus(`נמצאו ${j.places.length} מקומות.`);
    render();
  } catch {
    setStatus("אין חיבור לשרת. בדוק את האינטרנט ונסה שוב.", true);
  } finally { $("#go").disabled = false; $("#bar").hidden = true; }
}
$("#form").addEventListener("submit", e => { e.preventDefault(); scan($("#url").value); });
$("#pinForm").addEventListener("submit", e => { e.preventDefault(); store.set("ftm_pin", $("#pin").value.trim()); $("#pinForm").hidden = true; $("#pin").value = ""; if (state.pendingUrl) scan(state.pendingUrl); });
$("#paste").onclick = async () => { try { const t = await navigator.clipboard.readText(); $("#url").value = extractUrl(t) || t; if (extractUrl(t)) scan(t); } catch { $("#url").focus(); setStatus("הדבק את הקישור בשדה (לחיצה ארוכה ← הדבק)."); } };

/* ---- saved places live in folders, one per country by default ---- */
function loadFolders(){
  let f = store.get("ftm_folders", null);
  if (!f) {
    const old = store.get("ftm_trip", []);
    f = old.length ? [{ id: "f" + Date.now(), name: "הטיול שלי", places: old }] : [];
    store.set("ftm_folders", f);
  }
  return f;
}
let state = { res: store.get("ftm_last", null), tab: "list", sel: null, folders: loadFolders(), folder: null, days: {}, pick: null };
const saveFolders = () => store.set("ftm_folders", state.folders);

const COUNTRY_HE = { Japan:"יפן", "Czech Republic":"צ׳כיה", Czechia:"צ׳כיה", Portugal:"פורטוגל", Italy:"איטליה", France:"צרפת", Spain:"ספרד", Greece:"יוון", Thailand:"תאילנד", "United Kingdom":"אנגליה", UK:"אנגליה", England:"אנגליה", Germany:"גרמניה", Netherlands:"הולנד", Hungary:"הונגריה", Austria:"אוסטריה", "United States":"ארה״ב", USA:"ארה״ב", Israel:"ישראל", "United Arab Emirates":"איחוד האמירויות", UAE:"איחוד האמירויות", Turkey:"טורקיה", Türkiye:"טורקיה", "South Korea":"קוריאה", Georgia:"גאורגיה", Cyprus:"קפריסין", Poland:"פולין", Romania:"רומניה", Croatia:"קרואטיה", Montenegro:"מונטנגרו", Vietnam:"וייטנאם", India:"הודו", Mexico:"מקסיקו" };
const CITY_COUNTRY = { Tokyo:"יפן", Kyoto:"יפן", Osaka:"יפן", Prague:"צ׳כיה", Lisbon:"פורטוגל", Porto:"פורטוגל", Paris:"צרפת", Rome:"איטליה", Milan:"איטליה", Florence:"איטליה", Naples:"איטליה", London:"אנגליה", Berlin:"גרמניה", Amsterdam:"הולנד", Barcelona:"ספרד", Madrid:"ספרד", Athens:"יוון", Bangkok:"תאילנד", Dubai:"איחוד האמירויות", Budapest:"הונגריה", "New York":"ארה״ב", "Tel Aviv":"ישראל", Jerusalem:"ישראל", Vienna:"אוסטריה", Seoul:"קוריאה", Istanbul:"טורקיה" };
const suggestFolder = r => COUNTRY_HE[r?.country] || CITY_COUNTRY[r?.city] || r?.country || r?.city || "";

const key = p => (p.name + "|" + (p.city || "")).toLowerCase();
const folderOf = p => state.folders.find(f => f.places.some(t => key(t) === key(p)));
const withCity = p => ({ ...p, city: p.city || state.res?.city || "", source: p.source || state.res?.source?.url || "" });

function openPicker(places){
  state.pick = places.map(withCity);
  renderSheet();
}
function addToFolder(id){
  const f = state.folders.find(x => x.id === id);
  if (!f || !state.pick) return;
  let added = 0;
  state.pick.forEach(p => { if (!f.places.some(t => key(t) === key(p))) { f.places.push(p); added++; } });
  saveFolders();
  setStatus(added ? `נשמרו ${added} מקומות בתיקייה "${f.name}".` : `המקומות כבר נמצאים בתיקייה "${f.name}".`);
  state.pick = null; renderSheet(); render();
}
function renderSheet(){
  const el = $("#sheet");
  if (!state.pick) { el.hidden = true; el.innerHTML = ""; return; }
  const sug = suggestFolder(state.res);
  const match = state.folders.find(f => f.name === sug);
  el.hidden = false;
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <h3 id="sheetT">לאיזו תיקייה לשמור?</h3>
    <p class="sub" style="margin:0">${state.pick.length === 1 ? esc(state.pick[0].name) : state.pick.length + " מקומות"}</p>
    ${state.folders.length ? `<ul class="folders">${state.folders.map(f => `<li><button class="fbtn" data-pick="${f.id}"><span><b>${esc(f.name)}</b> <span class="sub">${f.places.length} מקומות</span></span>${f === match ? `<span class="chip">מתאים לסרטון</span>` : ""}</button></li>`).join("")}</ul>` : ""}
    <form id="newFolder" class="newf">
      <label for="nf">${state.folders.length ? "או תיקייה חדשה" : "שם התיקייה"}</label>
      <div class="scan"><input id="nf" value="${esc(match ? "" : sug)}" placeholder="למשל: יפן" style="direction:rtl;text-align:right;font-family:var(--f-body)" required>
      <button class="primary" type="submit">צור ושמור</button></div>
    </form>
    <button class="small" id="sheetClose" type="button" style="align-self:flex-start">ביטול</button>
  </div>`;
  $("#newFolder").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("#nf").value.trim(); if (!name) return;
    let f = state.folders.find(x => x.name === name);
    if (!f) { f = { id: "f" + Date.now().toString(36), name, places: [] }; state.folders.push(f); }
    addToFolder(f.id);
  });
}

/* ---- route: from the video when it has one, otherwise split the places into days ---- */
const SLOTS = ["בוקר", "צהריים", "אחה״צ", "ערב", "ערב", "לילה"];
function autoDays(places, nDays){
  const per = Math.ceil(places.length / nDays);
  const days = [];
  for (let d = 0; d < nDays; d++) {
    const chunk = places.slice(d * per, d * per + per);
    if (chunk.length) days.push({ day: d + 1, title: "", stops: chunk.map((p, j) => ({ p, slot: SLOTS[Math.min(j, SLOTS.length - 1)] })) });
  }
  return days;
}
function routeHTML(ctx, places, itinerary, city){
  if (!places.length) return `<div class="empty">אין מקומות לבנות מהם מסלול.</div>`;
  let days, auto = false;
  const n = state.days[ctx];
  if (itinerary?.length && n == null) {
    const byId = Object.fromEntries(places.map(p => [p.id, p]));
    days = itinerary.map(d => ({ day: d.day, title: d.title, stops: (d.stops || []).map(s => ({ p: byId[s.id], slot: s.slot })).filter(s => s.p) }));
  } else {
    auto = true;
    days = autoDays(places, Math.max(1, Math.min(places.length, n ?? Math.ceil(places.length / 4))));
  }
  const count = days.length;
  return `<div class="row daysbar"><span class="sub">${auto ? "מסלול לפי סדר המקומות" : "מסלול לפי אזורים"}</span>
      <span class="row"><button class="small" data-days="${ctx}|-1" aria-label="פחות ימים">−</button><span class="count" style="font-size:14px">${count} ימים</span><button class="small" data-days="${ctx}|1" aria-label="יותר ימים">+</button></span></div>
    ${days.map(d => `<div class="day"><div class="row" style="justify-content:space-between"><h3>יום ${esc(d.day)}${d.title ? " · " + esc(d.title) : ""}</h3>
      <a class="btn small primary-link" target="_blank" rel="noopener" href="${openRoute(d.stops.map(s => s.p), city)}">ניווט ביום הזה</a></div>
      <ol class="stops">${d.stops.map(s => `<li><span class="t">${esc(s.slot || "")}</span><span><b>${places.indexOf(s.p) + 1}. ${esc(s.p.name)}</b></span></li>`).join("")}</ol></div>`).join("")}
    <p class="sub">"ניווט ביום הזה" פותח את מפות Google עם כל התחנות של היום, לפי הסדר.</p>`;
}

/* ---- render ---- */
function placeHTML(p, i, city, inFolder){
  const f = inFolder ? null : folderOf(withCity(p));
  return `<li class="place ${state.sel===i?"sel":""}" data-i="${i}">
    <div class="num">${i+1}</div><div class="body">
      <h3>${esc(p.name)}</h3>${p.local && p.local!==p.name?`<div class="local">${esc(p.local)}</div>`:""}
      <div class="meta">${p.category?`<span class="chip">${esc(p.category)}</span>`:""}${inFolder && p.city?`<span>${esc(p.city)}</span>`:""}${p.neighborhood?`<span>${esc(p.neighborhood)}</span>`:""}${p.price?`<span>${esc(p.price)}</span>`:""}${!(p.lat)?`<span class="chip warn">מיקום לא אומת</span>`:""}</div>
      ${p.why?`<p>${esc(p.why)}</p>`:""}${p.dish?`<div class="sub">להזמין: ${esc(p.dish)}</div>`:""}
      ${p.rating?`<div class="score">★ ${(+p.rating).toFixed(1)} <small>גוגל · ${p.ratingCount||0} ביקורות</small></div>`:""}
      ${p.address?`<div class="sub">${esc(p.address.split(",").slice(0,3).join(","))}</div>`:""}
      <div class="row"><a class="btn small" href="${openOne(p, city)}" target="_blank" rel="noopener" data-stop>גוגל מפות</a>
        ${inFolder ? `<button class="small" data-remove="${i}" data-stop>הסר מהתיקייה</button>` : `<button class="small" data-save="${i}" data-stop>${f ? "✓ ב" + esc(f.name) : "+ שמור לתיקייה"}</button>`}</div>
    </div></li>`;
}

function render(){
  const r = state.res;
  const onFolders = state.tab === "folders";
  const folder = onFolders ? state.folders.find(f => f.id === state.folder) : null;
  if (!r && !onFolders) {
    $("#card").hidden = true; $("#tabs").hidden = !state.folders.length;
    renderTabs(r);
    $("#panel").innerHTML = `<div class="empty">הדבק קישור לסרטון על אוכל או טיול, ותקבל את המקומות על מפת גוגל.</div>`;
    return;
  }
  $("#tabs").hidden = false;
  renderTabs(r);

  if (onFolders && !folder) {
    $("#card").hidden = true;
    $("#panel").innerHTML = state.folders.length
      ? `<ul class="list">${state.folders.map(f => `<li><button class="fbtn card-btn" data-folder="${f.id}"><span><b style="font-size:17px">${esc(f.name)}</b><br><span class="sub">${f.places.length} מקומות · ${new Set(f.places.map(p => p.source).filter(Boolean)).size || 1} סרטונים</span></span><span aria-hidden="true">‹</span></button></li>`).join("")}</ul>`
      : `<div class="empty">עוד אין תיקיות. בכל סרטון לחץ "+ שמור לתיקייה", ותבחר או תיצור תיקייה, למשל לפי מדינה.</div>`;
    return;
  }

  const places = folder ? folder.places : r.places;
  const city = folder ? (places[0]?.city || "") : (r.city || "");
  const mode = folder ? (places.every(p => p.lat) ? "full" : "simple") : r.mode;
  $("#card").hidden = false;
  $("#title").textContent = folder ? folder.name : cleanTitle(r.title);
  $("#meta").innerHTML = folder
    ? `<button class="small" id="backFolders" type="button">› כל התיקיות</button><span>${places.length} מקומות</span>`
    : `${r.source?.author?`<span>${esc(r.source.author)}</span><span>·</span>`:""}<span>${esc([r.city,r.country].filter(Boolean).join(", "))}</span>${r.mode==="simple"?`<span class="chip warn">חילוץ בסיסי</span>`:""}${r.source?.url?`<a class="sub" href="${esc(r.source.url)}" target="_blank" rel="noopener">לסרטון</a>`:""}`;

  const sel = state.sel != null ? places[state.sel] : null;
  const src = sel ? embedOne(sel, sel.city || city) : embedAll(places, city, mode);
  if ($("#gmap").dataset.src !== src) { $("#gmap").src = src; $("#gmap").dataset.src = src; }
  $("#mapLabel").textContent = sel ? `${state.sel+1}. ${sel.name}` : (mode === "simple" ? "לחץ על מקום ברשימה כדי לראות אותו במפה" : (places.length > 1 ? "כל המקומות, לפי סדר המסלול" : ""));
  $("#showAll").hidden = !sel;
  $("#openG").href = sel ? openOne(sel, sel.city || city) : openRoute(places, city);

  let html = "";
  if (folder) {
    html = places.length
      ? `<h3 class="sec">מסלול</h3>${routeHTML("f:" + folder.id, places, null, city)}<h3 class="sec">המקומות בתיקייה</h3><ul class="list">${places.map((p,i)=>placeHTML(p,i,p.city,true)).join("")}</ul>`
      : `<div class="empty">התיקייה ריקה.</div>`;
  } else if (state.tab === "list") {
    html = `<div class="row" style="margin-bottom:10px"><button class="small" id="addAll">+ שמור הכל לתיקייה</button></div><ul class="list">${places.map((p,i)=>placeHTML(p,i,city,false)).join("")}</ul>`;
  } else {
    html = routeHTML("v", places, r.itinerary, city);
  }
  $("#panel").innerHTML = html;
}
function renderTabs(r){
  const routeDays = r ? (state.days.v != null ? Math.min(r.places.length, state.days.v) : (r.itinerary?.length || Math.ceil(r.places.length / 4))) : 0;
  const tabs = [["list","רשימה",r?.places.length||0],["route","מסלול",routeDays],["folders","התיקיות שלי",state.folders.length]].filter(([k]) => r || k === "folders");
  $("#tabs").innerHTML = tabs.map(([k,l,c]) => `<button role="tab" aria-selected="${state.tab===k}" data-tab="${k}">${l} <span class="count">${c}</span></button>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-save],[data-remove],[data-folder],[data-pick],[data-days],.place,#addAll,#showAll,#backFolders,#sheetClose,#sheet");
  if (!t) return;
  if (t.id === "sheet") { if (e.target === t) { state.pick = null; renderSheet(); } return; }
  if (t.id === "sheetClose") { state.pick = null; renderSheet(); return; }
  if (t.matches("[data-pick]")) { addToFolder(t.dataset.pick); return; }
  if (t.matches("[data-tab]")) { state.tab = t.dataset.tab; state.sel = null; if (state.tab !== "folders") state.folder = null; render(); return; }
  if (t.matches("[data-folder]")) { state.folder = t.dataset.folder; state.sel = null; render(); return; }
  if (t.id === "backFolders") { state.folder = null; state.sel = null; render(); return; }
  if (t.id === "showAll") { state.sel = null; render(); return; }
  if (t.id === "addAll") { openPicker(state.res.places); return; }
  if (t.matches("[data-save]")) { openPicker([state.res.places[+t.dataset.save]]); return; }
  if (t.matches("[data-remove]")) { const f = state.folders.find(x => x.id === state.folder); f.places.splice(+t.dataset.remove, 1); saveFolders(); state.sel = null; render(); return; }
  if (t.matches("[data-days]")) {
    const [ctx, step] = t.dataset.days.split("|");
    const list = ctx === "v" ? state.res.places : (state.folders.find(f => "f:" + f.id === ctx)?.places || []);
    const cur = state.days[ctx] ?? (ctx === "v" && state.res.itinerary?.length ? state.res.itinerary.length : Math.ceil(list.length / 4));
    state.days[ctx] = Math.max(1, Math.min(list.length, cur + +step));
    render(); return;
  }
  if (t.matches(".place") && !e.target.closest("[data-stop]")) { const i = +t.dataset.i; state.sel = state.sel === i ? null : i; render(); $(".map").scrollIntoView({behavior:"smooth", block:"nearest"}); }
});

/* ---- reset everything stored on this device ---- */
$("#resetAsk").onclick = () => { $("#resetConfirm").hidden = false; $("#resetAsk").hidden = true; };
$("#resetNo").onclick = () => { $("#resetConfirm").hidden = true; $("#resetAsk").hidden = false; };
$("#resetYes").onclick = () => {
  try { Object.keys(localStorage).filter(k => k.startsWith("ftm_")).forEach(k => localStorage.removeItem(k)); } catch {}
  state = { res: null, tab: "list", sel: null, folders: [], folder: null, days: {}, pick: null };
  $("#url").value = ""; $("#gmap").removeAttribute("src"); delete $("#gmap").dataset.src;
  $("#resetConfirm").hidden = true; $("#resetAsk").hidden = false;
  setStatus("האפליקציה אופסה. אפשר להתחיל מחדש.");
  render(); window.scrollTo({ top: 0 });
};

/* shared from another app, or opened with ?url= */
const qs = new URLSearchParams(location.search);
const shared = qs.get("url") || qs.get("text") || qs.get("title");
render();
if (extractUrl(shared)) { history.replaceState(null, "", location.pathname); scan(shared); }
</script>
</body>
</html>
