<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18212B">
<title>מהפיד למפה</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F4F2; --surface:#FFFFFF; --ink:#18212B; --muted:#5D6B72; --line:#D3DCD8;
  --pin:#C92F6F; --pin-ink:#FFFFFF; --route:#0F7F74; --soft:#E4ECE9; --warn:#9A6200; --warn-bg:#FBF0DA;
  --f-display:"Karantina","Rubik",system-ui,sans-serif; --f-body:"Rubik","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#111619; --surface:#1A2126; --ink:#E6ECEA; --muted:#97A6AC; --line:#2D383E;
  --pin:#EC5F98; --pin-ink:#1A0A11; --route:#3DBFAE; --soft:#222C31; --warn:#E9B65A; --warn-bg:#33281A; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-size:40px;line-height:1}
.brand h1 span{color:var(--pin)}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:13px;direction:ltr;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
button,.btn{font:inherit;font-weight:500;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:disabled{opacity:.55;cursor:default}
.small{padding:6px 10px;font-size:13px;border-radius:10px}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.status{margin:0;font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--pin)}
.bar{height:3px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--pin);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(120%)}to{transform:translateX(-340%)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px}
.head h2{font-family:var(--f-display);font-size:32px;line-height:1.05}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.map{position:relative;aspect-ratio:4/3.4;max-height:62vh;width:100%;background:var(--soft)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 6px}
.tabs button[aria-selected=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.count{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.place{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.place.sel{border-color:var(--pin);box-shadow:0 0 0 1px var(--pin)}
.num{width:26px;height:26px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.body h3{font-size:16px;font-weight:600}
.local{font-size:12px;color:var(--muted)}
.body p{margin:0;font-size:14px}
.sub{font-size:13px;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:13px}
.score small{font-family:var(--f-body);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.day h3{font-family:var(--f-display);font-size:24px;line-height:1}
.stops{list-style:none;margin:0;padding:0 12px 0 0;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stops li{display:flex;gap:10px;align-items:baseline}
.stops .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:50px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
.setup{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px;font-size:13px}
.setup b{color:var(--ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(17,22,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow-y:auto;box-sizing:border-box}
.sheet h3{font-family:var(--f-display);font-size:28px;line-height:1}
.folders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fbtn{width:100%;justify-content:space-between;text-align:right;min-height:52px;white-space:normal}
.card-btn{padding:14px 16px;border-radius:14px}
.newf{display:flex;flex-direction:column;gap:6px}
.newf label{font-size:12px;font-weight:600;color:var(--muted)}
.daysbar{justify-content:space-between;margin-bottom:10px}
.sec{font-family:var(--f-display);font-size:24px;line-height:1;margin:14px 0 8px}
.primary-link{background:var(--pin);color:var(--pin-ink);border-color:var(--pin)}
.day .primary-link{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#panel .day+.day{margin-top:10px}
.feedbar{display:flex;flex-direction:column;gap:8px}
.feedhead{display:flex;align-items:baseline;justify-content:space-between}
.vids{list-style:none;margin:0;padding:0 0 4px;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity}
.vid{flex:0 0 220px;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;scroll-snap-align:start;overflow:hidden}
.vid.on{border-color:var(--pin);box-shadow:0 0 0 1px var(--pin)}
.vbtn{flex:1;min-width:0;border:0;border-radius:0;background:transparent;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;text-align:right;white-space:normal}
.vt{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vdel{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);padding:0 12px}
.vdel:hover{color:var(--pin)}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--pin);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.save-all{background:var(--pin);border-color:var(--pin);color:var(--pin-ink);min-height:44px;font-weight:600}
.chip.ok{background:var(--soft);color:var(--route);font-weight:600;align-self:center}
.ghost{background:transparent;color:var(--muted)}
.share{margin:0 0 12px}
.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff;font-weight:600}
.area{color:var(--route)}
.area-chip{background:transparent;border:1px solid var(--route);color:var(--route)}
.day.rest{background:transparent;border-style:dashed}
.place.has-img{grid-template-columns:28px 1fr;grid-template-areas:"ph ph" "num body"}
.place.has-img .ph{grid-area:ph}
.place.has-img .num{grid-area:num}
.place.has-img .body{grid-area:body}
.ph{margin:-12px -12px 4px;position:relative;border-radius:14px 14px 0 0;overflow:hidden;background:var(--soft)}
.ph img{display:block;width:100%;height:170px;object-fit:cover}
.ph figcaption{position:absolute;bottom:6px;left:8px;font-size:11px}
.ph figcaption a{background:rgba(17,22,25,.6);color:#fff;padding:2px 8px;border-radius:99px;text-decoration:none}
.vbtn{position:relative}
.vthumb{width:100%;height:96px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.reset{margin-top:28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.danger{background:var(--pin);color:var(--pin-ink);border-color:var(--pin)}
</style>
</head>
<body>
<main class="app">
  <header class="brand"><h1>מהפיד <span>למפה</span></h1><span class="count" id="ver">v0.9</span></header>

  <form class="scan" id="form">
    <input id="url" type="url" inputmode="url" placeholder="הדבק קישור מטיקטוק או אינסטגרם" aria-label="קישור לסרטון" required>
    <button class="primary" id="go" type="submit">סרוק</button>
  </form>
  <div class="row"><button class="small" id="paste" type="button">הדבק מהלוח</button><span class="sub">או: שתף מטיקטוק ← מהפיד למפה (באנדרואיד, אחרי "הוסף למסך הבית")</span></div>
  <div class="bar" id="bar" hidden><i></i></div>
  <p class="status" id="status" role="status"></p>
  <div id="setup"></div>
  <form class="scan" id="pinForm" hidden>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="קוד גישה אישי" aria-label="קוד גישה אישי" style="direction:rtl;text-align:right;font-family:var(--f-body)">
    <button class="primary" type="submit">שמור</button>
  </form>

  <section class="feedbar" id="feedBar" hidden aria-label="הפיד שלי"></section>
  <p class="status" id="geoNote" hidden></p>
  <section class="card" id="card" hidden>
    <div class="head">
      <div class="meta" id="meta"></div>
      <h2 id="title"></h2>
    </div>
    <div class="map"><iframe id="gmap" title="מפת גוגל" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    <div class="mapbar"><span id="mapLabel">כל המקומות</span>
      <span class="row"><button class="small" id="showAll" type="button" hidden>הצג הכל</button><a class="btn small" id="openG" target="_blank" rel="noopener">פתח באפליקציית מפות</a></span></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs" hidden></nav>
  <section id="panel"></section>
  <footer class="reset" id="resetBox">
    <button class="small" id="resetAsk" type="button">איפוס האפליקציה</button>
    <div id="resetConfirm" class="setup" hidden>
      <p style="margin:0 0 8px"><b>למחוק מהמכשיר הזה את כל התיקיות, הסרטונים והמקומות?</b> אי אפשר לבטל את זה.</p>
      <div class="row"><button class="small danger" id="resetYes" type="button">מחק הכל</button><button class="small" id="resetNo" type="button">ביטול</button></div>
    </div>
  </footer>
</main>
<div id="sheet" class="sheet-bg" hidden></div>

<script>
/* ---- config: the server that reads the video ---- */
const API = "https://klzbaonibjyktzxhkjcg.supabase.co/functions/v1/scan";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsemJhb25pYmp5a3R6eGhramNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MzEzMTcsImV4cCI6MjEwOTAwNzMxN30.Y-lq_5AhnQ5oHWcjms502FJT2rbTNx8qhS-SS-4hzXE";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };


/* ---- Google map (embed, no key needed) ---- */
// Google resolves place names to the real business; raw coordinates show street addresses instead.
const loc = (p, city) => p.query || [p.name, p.neighborhood && /[a-z]/i.test(p.neighborhood) ? p.neighborhood : "", p.city || city].filter(Boolean).join(", ") || `${p.lat},${p.lng}`;
const label = (p, city) => [p.name, city].filter(Boolean).join(", ");
function embedAll(places, city, mode){
  const pts = places.slice(0, 10);
  if (!pts.length) return "about:blank";
  // One unknown stop breaks a Google route, so without smart extraction show the city and let the user tap places.
  if (mode === "simple" && city) return `https://maps.google.com/maps?output=embed&hl=he&z=13&q=${encodeURIComponent(city)}`;
  if (pts.length === 1) return embedOne(pts[0], city);
  const [first, ...rest] = pts;
  return `https://maps.google.com/maps?output=embed&hl=he&saddr=${encodeURIComponent(loc(first, city))}&daddr=${rest.map(p => encodeURIComponent(loc(p, city))).join("+to:")}`;
}
function embedOne(p, city){
  return `https://maps.google.com/maps?output=embed&hl=he&z=16&q=${encodeURIComponent(label(p, city))}${isFinite(p.lat)&&p.lat?`&ll=${p.lat},${p.lng}`:""}`;
}
const openOne = (p, city) => p.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(label(p, city))}`;
function openRoute(places, city){
  const q = places.slice(0, 10).map(p => encodeURIComponent(loc(p, city)));
  if (q.length < 2) return places[0] ? openOne(places[0], city) : "#";
  let u = `https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${q[0]}&destination=${q[q.length-1]}`;
  if (q.length > 2) u += `&waypoints=${q.slice(1,-1).join("%7C")}`;
  return u;
}

const cleanTitle = t => (String(t || "").split(/📍|\d\uFE0F?\u20E3|\s\d{1,2}[.)]\s/u)[0]
  .replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, "").replace(/\s+/g, " ").trim().slice(0, 70)) || "תוצאות";

/* ---- scanning ---- */
function setStatus(t, err){ $("#status").textContent = t; $("#status").classList.toggle("err", !!err); }
const extractUrl = s => (String(s||"").match(/https?:\/\/[^\s"'<>]+/) || [""])[0];

async function scan(raw){
  const url = extractUrl(raw);
  if (!url) { setStatus("לא מצאתי קישור. הדבק קישור שמתחיל ב־https://", true); return; }
  $("#url").value = url;
  $("#go").disabled = true; $("#bar").hidden = false; $("#setup").innerHTML = "";
  setStatus("קורא את הסרטון ומאתר את המקומות… (כמה שניות)");
  try {
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${ANON}`, apikey: ANON }, body: JSON.stringify({ url, pin: store.get("ftm_pin", "") }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { $("#pinForm").hidden = false; $("#pin").focus(); setStatus("הזן את קוד הגישה האישי שלך כדי לסרוק.", true); state.pendingUrl = url; return; }
    if (!r.ok) {
      setStatus(j.message || "השרת לא הצליח לעבד את הסרטון.", true);
      if (j.needs === "APIFY_TOKEN") $("#setup").innerHTML = `<div class="setup"><b>חסר שלב הגדרה:</b> טיקטוק מסתיר את הכיתוב משרתים בענן. צריך להוסיף מפתח Apify לשרת, ואז הקישור לבד יספיק.</div>`;
      return;
    }
    if (!j.places?.length) { setStatus("קראתי את הסרטון אבל לא מצאתי בו שמות של מקומות.", true); return; }
    j.key = vidKey(j);
    if (j.geocoder === "google") { state.google = true; j.places.forEach(p => p.gTried = true); } else if (j.geocoder === "device") state.google = false;
    state.feed = [j, ...state.feed.filter(v => v.key !== j.key)];
    saveFeed();
    state.res = j; state.sel = null; state.tab = "list"; state.folder = null; delete state.days.v;
    setStatus(`נמצאו ${j.places.length} מקומות. שמור אותם בתיקייה, או מחק את מה שלא מעניין אותך.`);
    render();
    locateCurrent();
  } catch {
    setStatus("אין חיבור לשרת. בדוק את האינטרנט ונסה שוב.", true);
  } finally { $("#go").disabled = false; $("#bar").hidden = true; }
}
$("#form").addEventListener("submit", e => { e.preventDefault(); scan($("#url").value); });
$("#pinForm").addEventListener("submit", e => { e.preventDefault(); store.set("ftm_pin", $("#pin").value.trim()); $("#pinForm").hidden = true; $("#pin").value = ""; if (state.pendingUrl) scan(state.pendingUrl); });
$("#paste").onclick = async () => { try { const t = await navigator.clipboard.readText(); $("#url").value = extractUrl(t) || t; if (extractUrl(t)) scan(t); } catch { $("#url").focus(); setStatus("הדבק את הקישור בשדה (לחיצה ארוכה ← הדבק)."); } };

/* ---- saved places live in folders, one per country by default ---- */
function loadFolders(){
  let f = store.get("ftm_folders", null);
  if (!f) {
    const old = store.get("ftm_trip", []);
    f = old.length ? [{ id: "f" + Date.now(), name: "הטיול שלי", places: old }] : [];
    store.set("ftm_folders", f);
  }
  return f;
}
// The feed keeps every scanned video until the user deletes it.
function loadFeed(){
  let f = store.get("ftm_feed", null);
  if (!f) { const last = store.get("ftm_last", null); f = last ? [last] : []; }
  f.forEach(v => { v.key = v.key || vidKey(v); });
  return f;
}
const vidKey = v => (v.source?.url || v.title || "").replace(/\?.*$/, "");
const saveFeed = () => store.set("ftm_feed", state.feed);
let state = { feed: [], res: null, tab: "list", sel: null, folders: loadFolders(), folder: null, days: {}, pick: null };
state.feed = loadFeed(); state.res = state.feed[0] || null;
const saveFolders = () => store.set("ftm_folders", state.folders);

const COUNTRY_HE = { Japan:"יפן", "Czech Republic":"צ׳כיה", Czechia:"צ׳כיה", Portugal:"פורטוגל", Italy:"איטליה", France:"צרפת", Spain:"ספרד", Greece:"יוון", Thailand:"תאילנד", "United Kingdom":"אנגליה", UK:"אנגליה", England:"אנגליה", Germany:"גרמניה", Netherlands:"הולנד", Hungary:"הונגריה", Austria:"אוסטריה", "United States":"ארה״ב", USA:"ארה״ב", Israel:"ישראל", "United Arab Emirates":"איחוד האמירויות", UAE:"איחוד האמירויות", Turkey:"טורקיה", Türkiye:"טורקיה", "South Korea":"קוריאה", Georgia:"גאורגיה", Cyprus:"קפריסין", Poland:"פולין", Romania:"רומניה", Croatia:"קרואטיה", Montenegro:"מונטנגרו", Vietnam:"וייטנאם", India:"הודו", Mexico:"מקסיקו" };
const CITY_COUNTRY = { Tokyo:"יפן", Kyoto:"יפן", Osaka:"יפן", Prague:"צ׳כיה", Lisbon:"פורטוגל", Porto:"פורטוגל", Paris:"צרפת", Rome:"איטליה", Milan:"איטליה", Florence:"איטליה", Naples:"איטליה", London:"אנגליה", Berlin:"גרמניה", Amsterdam:"הולנד", Barcelona:"ספרד", Madrid:"ספרד", Athens:"יוון", Bangkok:"תאילנד", Dubai:"איחוד האמירויות", Budapest:"הונגריה", "New York":"ארה״ב", "Tel Aviv":"ישראל", Jerusalem:"ישראל", Vienna:"אוסטריה", Seoul:"קוריאה", Istanbul:"טורקיה" };
const suggestFolder = r => COUNTRY_HE[r?.country] || CITY_COUNTRY[r?.city] || r?.country || r?.city || "";

const key = p => (p.name + "|" + (p.city || "")).toLowerCase();
const folderOf = p => state.folders.find(f => f.places.some(t => key(t) === key(p)));

/* ---- route: from the video when it has one, otherwise split the places into days ---- */
const SLOTS = ["בוקר", "צהריים", "אחה״צ", "ערב", "ערב", "לילה"];
/* ---- route by area: places with a location are grouped so each day stays in one area ---- */
const dist = (a, b) => { const k = Math.cos((a.lat + b.lat) / 2 * Math.PI / 180); return Math.hypot(a.lat - b.lat, (a.lng - b.lng) * k); };
function kmeans(pts, k){
  // farthest-point start, then a few rounds of k-means
  let cent = [pts[0]];
  while (cent.length < k) cent.push(pts.reduce((best, p) => Math.min(...cent.map(c => dist(p, c))) > Math.min(...cent.map(c => dist(best, c))) ? p : best, pts[0]));
  cent = cent.map(c => ({ lat: c.lat, lng: c.lng }));
  let group = [];
  for (let it = 0; it < 12; it++) {
    group = pts.map(p => cent.reduce((bi, c, i) => dist(p, c) < dist(p, cent[bi]) ? i : bi, 0));
    cent = cent.map((c, i) => { const m = pts.filter((_, j) => group[j] === i); return m.length ? { lat: m.reduce((s, p) => s + p.lat, 0) / m.length, lng: m.reduce((s, p) => s + p.lng, 0) / m.length } : c; });
  }
  return cent.map((_, i) => pts.filter((_, j) => group[j] === i)).filter(g => g.length);
}
function walkOrder(g){
  // start at the most western place and always walk to the nearest one left
  const left = [...g].sort((a, b) => a.lng - b.lng), out = [left.shift()];
  while (left.length) { const last = out[out.length - 1]; left.sort((a, b) => dist(last, a) - dist(last, b)); out.push(left.shift()); }
  return out;
}
const areaOf = p => p.area || (p.neighborhood && /[A-Za-zÀ-ÿ]/.test(p.neighborhood) ? p.neighborhood : "") || "";
function areaTitle(g){
  const c = {}; g.forEach(p => { const a = areaOf(p); if (a) c[a] = (c[a] || 0) + 1; });
  return Object.entries(c).sort((x, y) => y[1] - x[1]).slice(0, 2).map(([a]) => a).join(" · ");
}
function defaultDays(places){
  const located = places.filter(p => p.lat);
  if (located.length < 2) return Math.max(1, Math.ceil(places.length / 4));
  const areas = new Set(located.map(areaOf).filter(Boolean)).size || 1;
  return Math.max(1, Math.min(areas, Math.ceil(located.length / 2)));
}
function planDays(places, nDays){
  const located = places.filter(p => p.lat && p.lng);
  const rest = places.filter(p => !(p.lat && p.lng));
  if (located.length >= 2) {
    const k = Math.max(1, Math.min(nDays, located.length));
    const groups = kmeans(located, k).map(walkOrder).sort((a, b) => b.length - a.length);
    return { byArea: true, rest, days: groups.map((g, d) => ({ day: d + 1, title: areaTitle(g), stops: g.map((p, j) => ({ p, slot: SLOTS[Math.min(j, SLOTS.length - 1)] })) })) };
  }
  const per = Math.ceil(places.length / nDays), days = [];
  for (let d = 0; d < nDays; d++) { const chunk = places.slice(d * per, d * per + per); if (chunk.length) days.push({ day: d + 1, title: "", stops: chunk.map((p, j) => ({ p, slot: SLOTS[Math.min(j, SLOTS.length - 1)] })) }); }
  return { byArea: false, rest: [], days };
}
function currentDays(ctx, places, itinerary){
  const n = state.days[ctx];
  if (itinerary?.length && n == null) {
    const byId = Object.fromEntries(places.map(p => [p.id, p]));
    return { byArea: true, rest: [], days: itinerary.map(d => ({ day: d.day, title: d.title, stops: (d.stops || []).map(s => ({ p: byId[s.id], slot: s.slot })).filter(s => s.p) })).filter(d => d.stops.length) };
  }
  return planDays(places, Math.max(1, Math.min(places.length, n ?? defaultDays(places))));
}

const mapsLink = (p, city) => p.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(label(p, p.city || city))}`;
function shareText(kind, title, places, city, plan){

/* ---- find each place's location and area (OpenStreetMap via Photon), from this phone, in the background ---- */
const GENERIC = new Set(["restaurant","ristorante","trattoria","osteria","pizzeria","cafe","caffe","caffè","café","bar","the","and","di","da","del","della","la","il","le","de","du","of","al","pasticceria","bakery","shop","store","market","hotel","tokyo","rome","roma","paris","prague","london"]);
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9֐-׿぀-ヿ一-鿿 ]/g, " ");
const toks = t => norm(t).split(/\s+/).filter(w => (w.length >= 3 || /^\d+$/.test(w)) && !GENERIC.has(w));
const sameName = (want, got) => { const hits = want.filter(w => got.has(w)).length; return want.length <= 2 ? hits === want.length : hits >= Math.ceil(want.length * 2 / 3); };
const kmBetween = (a, b) => { const R = 6371, dLat = (b[1]-a[1])*Math.PI/180, dLon = (b[0]-a[0])*Math.PI/180; const x = Math.sin(dLat/2)**2 + Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
async function photon(q, center, limit = 5){
  const u = `https://photon.komoot.io/api/?limit=${limit}&q=${encodeURIComponent(q)}${center ? `&lon=${center[0]}&lat=${center[1]}&zoom=12` : ""}`;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(u, { signal: AbortSignal.timeout(6000) }); if (r.ok) return (await r.json()).features || []; } catch {}
    await new Promise(res => setTimeout(res, 600 * (i + 1)));
  }
  return null;
}
async function cityCenter(city){
  const cache = store.get("ftm_cities", {});
  if (cache[city]) return cache[city];
  let c = (await photon(city, null, 1))?.[0]?.geometry?.coordinates;
  if (!c) { const pg = (await wiki("en", `titles=${encodeURIComponent(city)}`))?.[0]?.coordinates?.[0]; if (pg) c = [pg.lon, pg.lat]; }
  if (c) { cache[city] = c; store.set("ftm_cities", cache); }
  return c;
}
async function locateOne(p, city, center){
  const want = toks(p.name);
  if (/[֐-׿]/.test(p.name) || !want.length) return "skip";
  const feats = await photon(`${p.name} ${city}`, center);
  if (feats === null) return "retry";
  const hit = feats.find(f => {
    const pr = f.properties || {};
    if (["city","town","country","state"].includes(pr.osm_value)) return false;
    if (kmBetween(center, f.geometry.coordinates) > 30) return false;
    return sameName(want, new Set(toks([pr.name, pr.locality, pr.district].filter(Boolean).join(" "))));
  });
  if (!hit) return "none";
  const pr = hit.properties;
  p.lng = hit.geometry.coordinates[0]; p.lat = hit.geometry.coordinates[1];
  p.area = pr.locality || pr.district || pr.suburb || "";
  p.address = p.address || [pr.street && (pr.street + (pr.housenumber ? " " + pr.housenumber : "")), pr.locality || pr.district, pr.city].filter(Boolean).join(", ");
  return "ok";
}
// One lookup per list at a time, but different videos and folders can run side by side.
const locatingNow = new WeakSet(), photographingNow = new WeakSet();
async function locatePlaces(places, city, onDone){
  const todo = places.filter(p => !p.lat && !p.geoTried);
  if (!todo.length || !city || locatingNow.has(places)) return;
  locatingNow.add(places);
  const note = $("#geoNote"); if (note) { note.hidden = false; note.textContent = `מאתר מיקום ואזור ל־${todo.length} מקומות…`; }
  try {
    const center = await cityCenter(city);
    if (center) {
      const queue = [...todo];
      let changed = 0;
      const worker = async () => { while (queue.length) { const p = queue.shift(); const r = await locateOne(p, city, center).catch(() => "retry"); if (r !== "retry") p.geoTried = true; if (r === "ok") { changed++; onDone(); } } };
      await Promise.all([worker(), worker()]);
      setStatus(changed ? `נמצא מיקום ואזור ל־${changed} מקומות.` : $("#status").textContent);
    }
  } finally { locatingNow.delete(places); onDone(); if (note) note.hidden = true; }
}

/* ---- photos from Wikipedia (free images, with a link to the source page) ---- */
// A photo is used only when the Wikipedia page is a real place near this city, so a restaurant
// called "Otello" never gets a picture of the opera.
async function wiki(lang, params){
  const u = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|coordinates&piprop=thumbnail&pithumbsize=480&${params}`;
  try { const r = await fetch(u, { signal: AbortSignal.timeout(6000) }); if (r.ok) return Object.values((await r.json()).query?.pages || {}).sort((a, b) => (a.index ?? 0) - (b.index ?? 0)); } catch {}
  return null;
}
function goodPage(pg, center){
  if (!pg || pg.missing !== undefined || !pg.thumbnail?.source) return false;
  const c = pg.coordinates?.[0];
  if (!c) return false;
  return !!center && kmBetween(center, [c.lon, c.lat]) < 30;
}
const HE_CITY = { Tokyo:"טוקיו", Kyoto:"קיוטו", Osaka:"אוסקה", Lisbon:"ליסבון", Porto:"פורטו", Paris:"פריז", Rome:"רומא", Milan:"מילאנו", London:"לונדון", Berlin:"ברלין", Amsterdam:"אמסטרדם", Barcelona:"ברצלונה", Madrid:"מדריד", Athens:"אתונה", Bangkok:"בנגקוק", Dubai:"דובאי", Prague:"פראג", Budapest:"בודפשט", "New York":"ניו יורק", Vienna:"וינה", Seoul:"סיאול", Istanbul:"איסטנבול", Naples:"נאפולי", Florence:"פירנצה" };
async function findPhoto(p, city){
  const lang = /[֐-׿]/.test(p.name) ? "he" : "en";
  // Without the city's location a photo can't be checked (a "Jewish Quarter" in Jerusalem is not the one in Prague), so wait.
  const center = city ? await cityCenter(city) : null;
  if (!center) return "retry";
  const name = p.name.replace(/[’‘`]/g, "'").replace(/[״“”]/g, '"');
  const cityWord = lang === "he" ? (HE_CITY[city] || city) : city;
  const exact = await wiki(lang, `titles=${[name, name + " (" + cityWord + ")", name + (lang === "he" ? " ב" : " in ") + cityWord].map(encodeURIComponent).join("|")}`);
  if (exact === null) return "retry";
  // A one-word name that Wikipedia redirects elsewhere ("Damaso" -> a church) is too risky to trust.
  const oneWord = toks(p.name).length < 2;
  let pg = exact.find(x => goodPage(x, center) && (!oneWord || norm(x.title).trim().startsWith(norm(name).trim())));
  if (!pg) {
    const found = await wiki(lang, `generator=search&gsrlimit=5&gsrsearch=${encodeURIComponent(name + (cityWord ? " " + cityWord : ""))}`);
    if (found === null) return "retry";
    const want = toks(p.name);
    pg = found.find(x => goodPage(x, center) && want.length && sameName(want, new Set(toks(x.title))));
  }
  if (!pg) return "none";
  p.img = pg.thumbnail.source;
  p.imgSrc = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(pg.title.replace(/ /g, "_"))}`;
  if (!p.lat && pg.coordinates?.[0]) { p.lat = pg.coordinates[0].lat; p.lng = pg.coordinates[0].lon; }
  return "ok";
}
async function photoPlaces(places, city, onDone){
  const todo = places.filter(p => !p.img && !p.imgTried);
  if (!todo.length || photographingNow.has(places)) return;
  photographingNow.add(places);
  try {
    const queue = [...todo];
    const worker = async () => { while (queue.length) { const p = queue.shift(); const r = await findPhoto(p, p.city || city).catch(() => "retry"); if (r !== "retry") p.imgTried = true; if (r === "ok") onDone(); } };
    await Promise.all([worker(), worker()]);
  } finally { photographingNow.delete(places); onDone(); }
}

/* ---- Google Places (when the server has a Google key): exact location, area, rating and a photo ---- */
const GKEYS = ["lat","lng","address","area","rating","ratingCount","mapsUrl","img","imgSrc","imgBy","source"];
const googlingNow = new WeakSet();
async function googleEnrich(places, city){
  if (state.google === false || googlingNow.has(places)) return;
  const todo = places.filter(p => !p.gTried);
  if (!todo.length) return;
  googlingNow.add(places);
  try {
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${ANON}`, apikey: ANON },
      body: JSON.stringify({ enrich: todo.map((p, i) => ({ id: String(i), name: p.name, query: p.query })), city: city || "", pin: store.get("ftm_pin", "") }),
      signal: AbortSignal.timeout(40000) });
    if (!r.ok) return;
    const j = await r.json();
    if (!j.google) { state.google = false; return; }
    state.google = true;
    (j.places || []).forEach(g => {
      const p = todo[+g.id]; if (!p) return;
      GKEYS.forEach(k => { if (g[k] !== undefined && g[k] !== null && g[k] !== "") p[k] = g[k]; });
      if (g.lat) p.geoTried = true;
      if (g.img) p.imgTried = true;
    });
    todo.forEach(p => p.gTried = true);
  } catch {} finally { googlingNow.delete(places); }
}
function copyToFolders(v){
  state.folders.forEach(f => f.places.forEach(fp => {
    const src = v.places.find(p => key(withCity(p)) === key(fp));
    if (!src) return;
    if (src.lat && !fp.lat) Object.assign(fp, { lat: src.lat, lng: src.lng, area: src.area, address: src.address });
    if (src.img && (!fp.img || (src.imgBy && !fp.imgBy))) Object.assign(fp, { img: src.img, imgSrc: src.imgSrc, imgBy: src.imgBy });
    if (src.rating && !fp.rating) Object.assign(fp, { rating: src.rating, ratingCount: src.ratingCount, mapsUrl: src.mapsUrl });
  }));
}
function locateCurrent(){
  if (state.tab === "folders") {
    const f = state.folders.find(x => x.id === state.folder);
    if (f) {
      const byCity = {}; f.places.forEach(p => (byCity[p.city || ""] ||= []).push(p));
      const done = () => { saveFolders(); render(); };
      Promise.all(Object.entries(byCity).map(([c, ps]) => googleEnrich(ps, c))).then(() => {
        done();
        Object.entries(byCity).forEach(([c, ps]) => locatePlaces(ps, c, done));
        photoPlaces(f.places, "", done);
      });
    }
  } else if (state.res) {
    const v = state.res;
    const done = () => { copyToFolders(v); saveFeed(); saveFolders(); render(); };
    // Google first (if the key is set); the free lookups then fill only what Google didn't find.
    googleEnrich(v.places, v.city).then(() => {
      done();
      locatePlaces(v.places, v.city, done);
      photoPlaces(v.places, v.city, done);
    });
  }
}

/* ---- render ---- */
function placeHTML(p, i, city, inFolder){
  const f = inFolder ? null : folderOf(withCity(p));
  return `<li class="place ${state.sel===i?"sel":""} ${p.img ? "has-img" : ""}" data-i="${i}">
    ${p.img ? `<figure class="ph"><img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"><figcaption><a href="${esc(p.imgSrc)}" target="_blank" rel="noopener" data-stop>${p.imgBy ? "גוגל · " + esc(p.imgBy) : "ויקיפדיה"}</a></figcaption></figure>` : ""}
    <div class="num">${i+1}</div><div class="body">
      <h3>${esc(p.name)}</h3>${p.local && p.local!==p.name?`<div class="local">${esc(p.local)}</div>`:""}
      <div class="meta">${p.category && p.category !== "מקום"?`<span class="chip">${esc(p.category)}</span>`:""}${inFolder && p.city?`<span>${esc(p.city)}</span>`:""}${areaOf(p)?`<span class="chip area-chip">${esc(areaOf(p))}</span>`:(p.neighborhood?`<span>${esc(p.neighborhood)}</span>`:"")}${p.price?`<span>${esc(p.price)}</span>`:""}</div>
      ${p.why?`<p>${esc(p.why)}</p>`:""}${p.dish?`<div class="sub">להזמין: ${esc(p.dish)}</div>`:""}
      ${p.rating?`<div class="score">★ ${(+p.rating).toFixed(1)} <small>גוגל · ${p.ratingCount||0} ביקורות</small></div>`:""}
      ${p.address?`<div class="sub">${esc(p.address.split(",").slice(0,3).join(","))}</div>`:""}
      <div class="row"><a class="btn small" href="${openOne(p, city)}" target="_blank" rel="noopener" data-stop>גוגל מפות</a>
        ${inFolder ? `<button class="small" data-remove="${i}" data-stop>מחק</button>` : `${f ? `<span class="chip ok">✓ ${esc(f.name)}</span>` : ""}<button class="small ${f ? "" : "primary-link"}" data-save="${i}" data-stop>${f ? "+ לתיקייה נוספת" : "+ לתיקייה"}</button><button class="small ghost" data-del="${i}" data-stop aria-label="מחק את ${esc(p.name)} מהפיד">מחק</button>`}</div>
    </div></li>`;
}

function renderFeedBar(){
  const el = $("#feedBar");
  el.hidden = !state.feed.length;
  if (!state.feed.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="feedhead"><b>הפיד שלי</b><span class="sub">${state.feed.length} סרטונים</span></div>
    <ul class="vids">${state.feed.map(v => {
      const on = v === state.res && state.tab !== "folders";
      return `<li class="vid ${on ? "on" : ""}"><button class="vbtn" data-video="${esc(v.key)}" aria-current="${on}">${v.source?.thumbnail ? `<img class="vthumb" src="${esc(v.source.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<span class="vt">${esc(cleanTitle(v.title))}</span><span class="sub">${esc(v.source?.author || "")}${v.city ? " · " + esc(v.city) : ""} · ${v.places.length} מקומות</span></button><button class="vdel" data-delvideo="${esc(v.key)}" aria-label="מחק את הסרטון מהפיד">✕</button></li>`;
    }).join("")}</ul>`;
}

function render(){
  renderFeedBar();
  const r = state.res;
  const onFolders = state.tab === "folders";
  const folder = onFolders ? state.folders.find(f => f.id === state.folder) : null;
  if (!r && !onFolders) {
    $("#card").hidden = true; $("#tabs").hidden = !state.folders.length;
    renderTabs(r);
    $("#panel").innerHTML = `<div class="empty">הדבק קישור לסרטון על אוכל או טיול, ותקבל את המקומות על מפת גוגל.</div>`;
    return;
  }
  $("#tabs").hidden = false;
  renderTabs(r);

  if (onFolders && !folder) {
    $("#card").hidden = true;
    $("#panel").innerHTML = state.folders.length
      ? `<ul class="list">${state.folders.map(f => `<li><button class="fbtn card-btn" data-folder="${f.id}"><span><b style="font-size:17px">${esc(f.name)}</b><br><span class="sub">${f.places.length} מקומות · ${new Set(f.places.map(p => p.source).filter(Boolean)).size || 1} סרטונים</span></span><span aria-hidden="true">‹</span></button></li>`).join("")}</ul>`
      : `<div class="empty">עוד אין תיקיות. בכל סרטון לחץ "+ שמור לתיקייה", ותבחר או תיצור תיקייה, למשל לפי מדינה.</div>`;
    return;
  }

  const places = folder ? folder.places : r.places;
  const city = folder ? (places[0]?.city || "") : (r.city || "");
  const mode = folder ? (places.every(p => p.lat) ? "full" : "simple") : r.mode;
  $("#card").hidden = false;
  $("#title").textContent = folder ? folder.name : cleanTitle(r.title);
  $("#meta").innerHTML = folder
    ? `<button class="small" id="backFolders" type="button">› כל התיקיות</button><span>${places.length} מקומות</span><button class="small" id="delFolderAsk" type="button">מחק תיקייה</button>`
    : `${r.source?.author?`<span>${esc(r.source.author)}</span><span>·</span>`:""}<span>${esc([r.city,r.country].filter(Boolean).join(", "))}</span>${r.mode==="simple"?`<span class="chip warn">חילוץ בסיסי</span>`:""}${r.source?.url?`<a class="sub" href="${esc(r.source.url)}" target="_blank" rel="noopener">לסרטון</a>`:""}`;

  const sel = state.sel != null ? places[state.sel] : null;
  const src = sel ? embedOne(sel, sel.city || city) : embedAll(places, city, mode);
  if ($("#gmap").dataset.src !== src) { $("#gmap").src = src; $("#gmap").dataset.src = src; }
  $("#mapLabel").textContent = sel ? `${state.sel+1}. ${sel.name}` : (mode === "simple" ? "לחץ על מקום ברשימה כדי לראות אותו במפה" : (places.length > 1 ? "כל המקומות, לפי סדר המסלול" : ""));
  $("#showAll").hidden = !sel;
  $("#openG").href = sel ? openOne(sel, sel.city || city) : openRoute(places, city);

  let html = "";
  if (folder) {
    html = `<div id="delFolderConfirm" class="setup" hidden style="margin-bottom:12px"><p style="margin:0 0 8px"><b>למחוק את התיקייה "${esc(folder.name)}" עם כל ${places.length} המקומות שבה?</b></p><div class="row"><button class="small danger" id="delFolderYes" type="button">מחק תיקייה</button><button class="small" id="delFolderNo" type="button">ביטול</button></div></div>` + (places.length
      ? `<h3 class="sec">מסלול</h3>${routeHTML("f:" + folder.id, places, null, city, folder.name)}<h3 class="sec">המקומות בתיקייה</h3>${shareRow(shareText("list", folder.name, places, city))}<ul class="list">${places.map((p,i)=>placeHTML(p,i,p.city,true)).join("")}</ul>`
      : `<div class="empty">התיקייה ריקה.</div>`);
  } else if (state.tab === "list") {
    const savedN = places.filter(p => folderOf(withCity(p))).length;
    html = `<div class="savebar"><div><b>${savedN === places.length ? "כל המקומות שמורים בתיקיות" : `${places.length - savedN} מקומות עוד לא בתיקייה`}</b><div class="sub">שמירה לתיקייה לא מוחקת מהפיד</div></div>
      <button class="primary-link save-all" id="addAll">+ שמור הכל לתיקייה</button></div>
      ${shareRow(shareText("list", cleanTitle(r.title), places, city))}
      <ul class="list">${places.map((p,i)=>placeHTML(p,i,city,false)).join("")}</ul>`;
  } else {
    html = routeHTML("v", places, r.itinerary, city, cleanTitle(r.title));
  }
  $("#panel").innerHTML = html;
}
function renderTabs(r){
  const routeDays = r ? (state.days.v != null ? Math.min(r.places.length, state.days.v) : (r.itinerary?.length || currentDays("v", r.places, r.itinerary).days.length)) : 0;
  const tabs = [["list","רשימה",r?.places.length||0],["route","מסלול",routeDays],["folders","התיקיות שלי",state.folders.length]].filter(([k]) => r || k === "folders");
  $("#tabs").innerHTML = tabs.map(([k,l,c]) => `<button role="tab" aria-selected="${state.tab===k}" data-tab="${k}">${l} <span class="count">${c}</span></button>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-save],[data-remove],[data-del],[data-folder],[data-pick],[data-days],[data-share],.place,#addAll,[data-video],[data-delvideo],#showAll,#backFolders,#delFolderAsk,#delFolderYes,#delFolderNo,#sheetClose,#sheet");
  if (!t) return;
  if (t.id === "sheet") { if (e.target === t) { state.pick = null; renderSheet(); } return; }
  if (t.id === "sheetClose") { state.pick = null; renderSheet(); return; }
  if (t.matches("[data-pick]")) { addToFolder(t.dataset.pick); return; }
  if (t.matches("[data-tab]")) { state.tab = t.dataset.tab; state.sel = null; if (state.tab !== "folders") state.folder = null; render(); return; }
  if (t.matches("[data-folder]")) { state.folder = t.dataset.folder; state.sel = null; render(); locateCurrent(); return; }
  if (t.id === "backFolders") { state.folder = null; state.sel = null; render(); return; }
  if (t.id === "showAll") { state.sel = null; render(); return; }
  if (t.id === "addAll") { openPicker(state.res.places); return; }
  if (t.matches("[data-save]")) { openPicker([state.res.places[+t.dataset.save]]); return; }
  if (t.matches("[data-del]")) { const p = state.res.places[+t.dataset.del]; removeFromFeed(x => x === p); setStatus(`"${p.name}" נמחק מהפיד.`); render(); return; }
  if (t.matches("[data-video]")) { state.res = state.feed.find(v => v.key === t.dataset.video) || null; state.tab = "list"; state.sel = null; state.folder = null; delete state.days.v; render(); locateCurrent(); return; }
  if (t.matches("[data-delvideo]")) { const v = state.feed.find(x => x.key === t.dataset.delvideo); if (v) { removeVideo(v); setStatus(`הסרטון "${cleanTitle(v.title)}" נמחק מהפיד.`); } render(); return; }
  if (t.id === "delFolderAsk") { $("#delFolderConfirm").hidden = false; return; }
  if (t.id === "delFolderNo") { $("#delFolderConfirm").hidden = true; return; }
  if (t.id === "delFolderYes") { const f = state.folders.find(x => x.id === state.folder); state.folders = state.folders.filter(x => x !== f); saveFolders(); state.folder = null; state.sel = null; setStatus(`התיקייה "${f.name}" נמחקה.`); render(); return; }
  if (t.matches("[data-remove]")) { const f = state.folders.find(x => x.id === state.folder); f.places.splice(+t.dataset.remove, 1); saveFolders(); state.sel = null; render(); return; }
  if (t.matches("[data-share]")) { navigator.share({ text: decodeURIComponent(t.dataset.share) }).catch(() => {}); return; }
  if (t.matches("[data-days]")) {
    const [ctx, step] = t.dataset.days.split("|");
    const list = ctx === "v" ? state.res.places : (state.folders.find(f => "f:" + f.id === ctx)?.places || []);
    const cur = state.days[ctx] ?? (ctx === "v" && state.res.itinerary?.length ? state.res.itinerary.length : currentDays(ctx, list, null).days.length);
    state.days[ctx] = Math.max(1, Math.min(list.length, cur + +step));
    render(); return;
  }
  if (t.matches(".place") && !e.target.closest("[data-stop]")) { const i = +t.dataset.i; state.sel = state.sel === i ? null : i; render(); $(".map").scrollIntoView({behavior:"smooth", block:"nearest"}); }
});

/* ---- reset everything stored on this device ---- */
$("#resetAsk").onclick = () => { $("#resetConfirm").hidden = false; $("#resetAsk").hidden = true; };
$("#resetNo").onclick = () => { $("#resetConfirm").hidden = true; $("#resetAsk").hidden = false; };
$("#resetYes").onclick = () => {
  try { Object.keys(localStorage).filter(k => k.startsWith("ftm_")).forEach(k => localStorage.removeItem(k)); } catch {}
  state = { feed: [], res: null, tab: "list", sel: null, folders: [], folder: null, days: {}, pick: null };
  $("#url").value = ""; $("#gmap").removeAttribute("src"); delete $("#gmap").dataset.src;
  $("#resetConfirm").hidden = true; $("#resetAsk").hidden = false;
  setStatus("האפליקציה אופסה. אפשר להתחיל מחדש.");
  render(); window.scrollTo({ top: 0 });
};

/* shared from another app, or opened with ?url= */
const qs = new URLSearchParams(location.search);
const shared = qs.get("url") || qs.get("text") || qs.get("title");
render();
locateCurrent();
if (extractUrl(shared)) { history.replaceState(null, "", location.pathname); scan(shared); }
</script>
</body>
</html>
